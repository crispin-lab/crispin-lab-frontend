name: Setup
description: pnpm + Node.js + frozen install. Caller 가 먼저 actions/checkout 을 호출했다고 가정.

runs:
  using: composite
  steps:
    # 버전은 package.json 의 packageManager 필드에서 자동 해석.
    # setup-node 보다 먼저 와야 setup-node 의 cache: 'pnpm' 이 pnpm 바이너리를 찾을 수 있음.
    - name: Setup pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
