name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main push 가 자기 자신을 취소하지 않도록 PR 에서만 cancel
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint / Typecheck / Format / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # 후속 step 에 GITHUB_TOKEN 이 .git/config 로 남지 않게 한다 — read-only workflow 라 노출 비용 0.
          persist-credentials: false

      - name: Setup pnpm
        # 버전은 package.json 의 packageManager 필드에서 자동 해석.
        # setup-node 보다 먼저 와야 setup-node 의 cache: 'pnpm' 이 pnpm 바이너리를 찾을 수 있음.
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # 캐시 step 은 install 이전 — install 이후엔 hashFiles 가 node_modules 안의 .ts/.tsx 까지
      # 스캔해 키가 의존성 트리에 흔들리고 해시 비용이 커진다. glob 도 src + 루트 설정 파일로 좁힌다.
      - name: Cache Next.js build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.*', 'postcss.config.*', 'tsconfig.json', 'tailwind.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
